name: CodeQL (Actions)

# Scans the workflow files themselves. See codeql-csharp.yml for why CodeQL runs
# from workflow files instead of GitHub's default setup.

on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/**'
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze Actions
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: actions

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:actions"
