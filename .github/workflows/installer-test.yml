name: Installer Test

on:
  push:
    branches: [ "main" ]
    paths:
      - 'scripts/install_service.sh'
      - 'scripts/uninstall_service.sh'
      - 'scripts/test_installer.sh'
      - '.github/workflows/installer-test.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'scripts/install_service.sh'
      - 'scripts/uninstall_service.sh'
      - 'scripts/test_installer.sh'
      - '.github/workflows/installer-test.yml'

jobs:
  test-installer:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run Installer Test
      run: |
        chmod +x scripts/*.sh
        ./scripts/test_installer.sh
