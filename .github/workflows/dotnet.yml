name: .NET CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'server/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'server/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore server/OpenScanner.slnx

    - name: Build
      run: dotnet build server/OpenScanner.slnx --no-restore

    - name: Test
      run: dotnet test server/OpenScanner.slnx --no-build --verbosity normal
