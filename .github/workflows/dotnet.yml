name: .NET CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'server/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'server/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg cmake build-essential libitpp-dev libsndfile1-dev libusb-1.0-0-dev libncurses-dev libcodec2-dev libpulse-dev librtlsdr-dev

    - name: Build and Install mbelib
      run: |
        git clone https://github.com/szechyjs/mbelib.git
        cd mbelib
        mkdir build && cd build
        cmake ..
        make
        sudo make install
        sudo ldconfig

    - name: Build and Install dsd-fme
      run: |
        git clone https://github.com/lwvmobile/dsd-fme.git
        cd dsd-fme
        mkdir build && cd build
        cmake ..
        make
        sudo make install
        sudo ldconfig

    - name: Restore dependencies
      run: dotnet restore server/OpenScanner.slnx

    - name: Build
      # Skip the frontend build here — the client is built and validated by the
      # Frontend workflow, so building it again in the .NET job is redundant.
      run: dotnet build server/OpenScanner.slnx --no-restore -p:SkipFrontendBuild=true

    - name: Test
      run: dotnet test server/OpenScanner.slnx --no-build --verbosity normal
